<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Sederhana</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f9;
            color: #333;
        }
        .card {
            background: white;
            padding: 20px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Biodata Sederhana</h2>
        <p>Buka <strong>Developer Tools</strong> (tekan <code>F12</code> atau <code>Ctrl+Shift+I</code>) lalu cek tab <strong>Console</strong> untuk melihat output JavaScript.</p>
    </div>

    <script>
        // 1. Membuat variabel
        let nama = "M. Azkiya"; 
        let umur = 19;          
        let isSiswa = true;     

        // 2. Menampilkan ketiganya ke layar (console)
        console.log("=== Biodata ===");
        console.log("Nama: ", nama);
        console.log("Umur: ", umur);
        console.log("Apakah Siswa?: ", isSiswa);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Biodata Mahasantri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{
  --text:#2a1342; --muted:#7a6590; --field:rgba(255,255,255,.75); --card:rgba(255,255,255,.72);
  --line:rgba(150,80,200,.25); --accent1:#ff4fa3; --accent2:#8e3ff0; --chipText:#5b3a7a;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{
  margin:0; min-height:100%; font-family:'Poppins',system-ui,'Segoe UI',Arial,sans-serif; color:var(--text);
  display:flex; justify-content:center; align-items:center; padding:32px 16px; position:relative; overflow-x:hidden;
  background:linear-gradient(-45deg,#ff5fa8,#c13fd6,#7a3ff2,#ff7ac0,#5b2fd0);
  background-size:400% 400%; animation:flow 14s ease infinite;
}
@keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.blob{position:fixed; border-radius:50%; filter:blur(60px); opacity:.55; pointer-events:none; animation:float 12s ease-in-out infinite}
.b1{width:320px;height:320px;background:#ff8fd0;top:-80px;left:-80px}
.b2{width:380px;height:380px;background:#8a5cff;bottom:-120px;right:-100px;animation-delay:-4s}
.b3{width:220px;height:220px;background:#ff4fa3;top:55%;left:60%;animation-delay:-8s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-50px) scale(1.15)}}

.card{
  position:relative; z-index:1; width:100%; max-width:660px; padding:40px 36px; border-radius:28px;
  background:var(--card); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  box-shadow:0 30px 80px rgba(60,10,110,.35); animation:rise .8s ease both;
}
.card::before{
  content:""; position:absolute; inset:-2px; border-radius:30px; z-index:-2;
  background:linear-gradient(120deg,#ff4fa3,#8e3ff0,#ff9ad5,#6a2fe0,#ff4fa3);
  background-size:300% 300%; animation:flow 6s linear infinite;
}
.card::after{content:""; position:absolute; inset:0; border-radius:28px; background:#fbf4ff; z-index:-1}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}

.badge{
  display:inline-block; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
  padding:6px 14px; border-radius:99px; color:#fff; background:linear-gradient(90deg,var(--accent1),var(--accent2));
}
h1{
  margin:14px 0 6px; font-size:clamp(24px,5vw,32px); font-weight:700; line-height:1.25;
  background:linear-gradient(90deg,#ff3d97,#8e3ff0,#ff3d97); background-size:200% auto;
  -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 4s linear infinite;
}
@keyframes shine{to{background-position:200% center}}
.sub{margin:0 0 28px; color:var(--muted); font-size:14px}

.field{margin-bottom:20px}
.label{display:block; margin-bottom:8px; font-size:13px; font-weight:600}
.label b{color:var(--accent1)}
.input{
  display:flex; align-items:flex-start; border:1.5px solid var(--line); border-radius:14px;
  background:var(--field); transition:.25s; overflow:hidden;
}
.input:focus-within{border-color:var(--accent2); box-shadow:0 0 0 4px rgba(142,63,240,.18); transform:translateY(-1px)}
.icon{
  width:50px; min-height:48px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px;
  background:linear-gradient(135deg,rgba(255,79,163,.2),rgba(142,63,240,.2));
}
input[type=text],input[type=email],textarea,select{
  width:100%; border:0; outline:0; background:transparent; color:var(--text); font:inherit; font-size:14px; padding:14px 16px;
}
textarea{resize:vertical; min-height:100px}
select{cursor:pointer; appearance:none; -webkit-appearance:none}
select option{color:#2a1342}
::placeholder{color:var(--muted); opacity:.7}
.select-wrap{position:relative}
.select-wrap::after{content:"▾"; position:absolute; right:18px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--accent2)}

.chips{display:flex; flex-wrap:wrap; gap:10px}
.chip{position:relative}
.chip input{position:absolute; opacity:0; pointer-events:none}
.chip span{
  display:inline-block; padding:10px 18px; border-radius:99px; font-size:13px; font-weight:500; cursor:pointer;
  border:1.5px solid var(--line); background:var(--field); color:var(--chipText); transition:.25s; user-select:none;
}
.chip span:hover{transform:translateY(-2px); border-color:var(--accent1)}
.chip input:checked + span{
  color:#fff; border-color:transparent; box-shadow:0 8px 20px rgba(142,63,240,.35);
  background:linear-gradient(135deg,var(--accent1),var(--accent2));
}
.chip input:focus-visible + span{outline:3px solid rgba(142,63,240,.4); outline-offset:2px}

.btn{
  width:100%; margin-top:10px; padding:16px; border:0; border-radius:16px; cursor:pointer;
  font:inherit; font-size:16px; font-weight:600; letter-spacing:.04em; color:#fff;
  background:linear-gradient(90deg,#ff4fa3,#8e3ff0,#ff4fa3); background-size:200% auto;
  box-shadow:0 14px 30px rgba(142,63,240,.4); transition:.35s;
}
.btn:hover{background-position:100% center; transform:translateY(-3px); box-shadow:0 20px 40px rgba(255,79,163,.45)}
.btn:active{transform:translateY(0)}
.foot{margin:18px 0 0; text-align:center; font-size:12px; color:var(--muted)}

/* ===== Latar selebrasi "SIUUU" ===== */
.lights{position:fixed; inset:0; pointer-events:none; overflow:hidden}
.lights i{
  position:absolute; top:-10%; width:160px; height:130%; transform-origin:top center; opacity:.22;
  background:linear-gradient(180deg,rgba(255,255,255,.9),transparent 75%); filter:blur(6px);
  animation:sweep 7s ease-in-out infinite alternate;
}
.lights i:nth-child(1){left:8%; --a:-18deg}
.lights i:nth-child(2){left:48%; --a:14deg; animation-delay:-3s}
.lights i:nth-child(3){left:84%; --a:-10deg; animation-delay:-5s}
@keyframes sweep{from{transform:rotate(var(--a))}to{transform:rotate(calc(var(--a) * -1))}}

.pitch{
  position:fixed; left:0; right:0; bottom:0; height:90px; pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(40,0,80,.45));
  border-top:2px solid rgba(255,255,255,.25);
}
.stage{position:fixed; left:4%; bottom:18px; width:min(230px,38vw); pointer-events:none; perspective:700px}
.siu{width:100%; transform-style:preserve-3d; animation:siuJump 3.4s cubic-bezier(.3,.1,.3,1) infinite}
.siu svg{width:100%; height:auto; display:block; filter:drop-shadow(0 8px 18px rgba(60,0,110,.45))}
@keyframes siuJump{
  0%,12%{transform:translateY(0) rotateY(0)}
  45%{transform:translateY(-130px) rotateY(180deg)}
  78%{transform:translateY(0) rotateY(360deg)}
  100%{transform:translateY(0) rotateY(360deg)}
}
.shadow{
  position:absolute; left:15%; right:15%; bottom:-6px; height:14px; border-radius:50%;
  background:rgba(30,0,60,.45); filter:blur(4px); animation:shadowPulse 3.4s cubic-bezier(.3,.1,.3,1) infinite;
}
@keyframes shadowPulse{0%,12%,78%,100%{transform:scaleX(1);opacity:.9}45%{transform:scaleX(.5);opacity:.4}}
.siu-text{
  position:absolute; left:50%; top:-46px; transform:translateX(-50%) scale(0); white-space:nowrap;
  font-weight:800; font-size:clamp(26px,5vw,44px); letter-spacing:.04em; color:#fff;
  text-shadow:0 0 18px rgba(255,79,163,.9),0 4px 0 rgba(90,20,160,.7); animation:siuText 3.4s ease infinite;
}
@keyframes siuText{
  0%,76%{transform:translateX(-50%) scale(0) rotate(-8deg); opacity:0}
  82%{transform:translateX(-50%) scale(1.25) rotate(4deg); opacity:1}
  90%,96%{transform:translateX(-50%) scale(1) rotate(-2deg); opacity:1}
  100%{transform:translateX(-50%) scale(.8); opacity:0}
}
.confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden}
.confetti span{
  position:absolute; top:-20px; width:9px; height:16px; border-radius:2px; background:var(--c); opacity:0;
  left:var(--x); animation:fall 6s linear infinite; animation-delay:var(--d);
}
@keyframes fall{
  0%{transform:translateY(0) rotate(0); opacity:0}
  8%{opacity:.95}
  100%{transform:translateY(110vh) rotate(720deg); opacity:.9}
}

@media (max-width:520px){ .card{padding:30px 20px} .stage{left:-4%; opacity:.6} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important} }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="lights"><i></i><i></i><i></i></div>
<div class="pitch"></div>
<div class="confetti" aria-hidden="true">
  <span style="--x:6%;--d:0s;--c:#fff"></span><span style="--x:14%;--d:1.2s;--c:#ffd1ec"></span>
  <span style="--x:22%;--d:3.1s;--c:#ffb3e0"></span><span style="--x:31%;--d:.6s;--c:#e0c4ff"></span>
  <span style="--x:39%;--d:2.4s;--c:#fff"></span><span style="--x:47%;--d:4.2s;--c:#ff8fd0"></span>
  <span style="--x:55%;--d:1.8s;--c:#d2b3ff"></span><span style="--x:63%;--d:3.6s;--c:#fff"></span>
  <span style="--x:71%;--d:.3s;--c:#ffc2e6"></span><span style="--x:79%;--d:2.9s;--c:#e8d4ff"></span>
  <span style="--x:86%;--d:4.8s;--c:#fff"></span><span style="--x:93%;--d:1.5s;--c:#ff9bd5"></span>
</div>

<!-- Siluet pemain melakukan selebrasi lompat–putar–mendarat (SIUUU) -->
<div class="stage" aria-hidden="true">
  <div class="siu-text">SIUUU!</div>
  <div class="siu">
    <svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="jersey" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3d9ff"/>
        </linearGradient>
      </defs>
      <g fill="url(#jersey)" stroke="url(#jersey)" stroke-linecap="round">
        <circle cx="100" cy="38" r="17" stroke="none"/>
        <rect x="79" y="60" width="42" height="82" rx="18" stroke="none"/>
        <rect x="81" y="136" width="38" height="34" rx="8" stroke="none"/>
        <line x1="82" y1="72" x2="44" y2="150" stroke-width="13"/>
        <line x1="118" y1="72" x2="156" y2="150" stroke-width="13"/>
        <line x1="91" y1="168" x2="70" y2="252" stroke-width="15"/>
        <line x1="109" y1="168" x2="130" y2="252" stroke-width="15"/>
        <ellipse cx="65" cy="262" rx="15" ry="7" stroke="none"/>
        <ellipse cx="135" cy="262" rx="15" ry="7" stroke="none"/>
      </g>
    </svg>
  </div>
  <div class="shadow"></div>
</div>

<main class="card">
  <span class="badge">Biodata</span>
  <h1>Form Biodata Mahasantri</h1>
  <p class="sub">Lengkapi data diri kamu dengan benar. Kolom bertanda <b style="color:var(--accent1)">*</b> wajib diisi.</p>

  <form action="#" method="post">
    <div class="field">
      <label class="label" for="nama">Nama Lengkap <b>*</b></label>
      <div class="input"><span class="icon">👤</span>
        <input id="nama" name="nama" type="text" placeholder="Masukkan nama lengkap" autocomplete="name" required></div>
    </div>

    <div class="field">
      <label class="label" for="nim">NIM <b>*</b></label>
      <div class="input"><span class="icon">🪪</span>
        <input id="nim" name="nim" type="text" inputmode="numeric" placeholder="Masukkan NIM" required></div>
    </div>

    <div class="field">
      <label class="label" for="email">Email <b>*</b></label>
      <div class="input"><span class="icon">✉️</span>
        <input id="email" name="email" type="email" placeholder="nama@email.com" autocomplete="email" required></div>
    </div>

    <div class="field">
      <span class="label">Jurusan <b>*</b></span>
      <div class="chips">
        <label class="chip"><input type="radio" name="jurusan" value="sd" required><span>💻 Software Development</span></label>
        <label class="chip"><input type="radio" name="jurusan" value="dm"><span>📣 Digital Marketing</span></label>
      </div>
    </div>

    <div class="field">
      <span class="label">Hobi</span>
      <div class="chips">
        <label class="chip"><input type="checkbox" name="hobi[]" value="a"><span>🎣 Memancing</span></label>
        <label class="chip"><input type="checkbox" name="hobi[]" value="b"><span>⚽ Olahraga</span></label>
        <label class="chip"><input type="checkbox" name="hobi[]" value="c"><span>📚 Membaca</span></label>
        <label class="chip"><input type="checkbox" name="hobi[]" value="d"><span>🎬 Menonton</span></label>
      </div>
    </div>

    <div class="field">
      <label class="label" for="alamat">Alamat <b>*</b></label>
      <div class="input"><span class="icon">📍</span>
        <textarea id="alamat" name="alamat" rows="4" placeholder="Tulis alamat lengkap" required></textarea></div>
    </div>

    <div class="field">
      <label class="label" for="matakuliah">Mata Kuliah</label>
      <div class="input select-wrap"><span class="icon">🎓</span>
        <select id="matakuliah" name="matakuliah">
          <option value="wd">Web Design</option>
          <option value="db">Database SQL</option>
          <option value="ph">Pemrograman PHP</option>
          <option value="py">Pemrograman Python</option>
        </select></div>
    </div>

    <button class="btn" type="submit" name="submit">Kirim Data</button>
    <p class="foot">Data kamu aman dan hanya digunakan untuk keperluan akademik.</p>
  </form>
</main>
</body>
</html>
